on:
  workflow_call:
    secrets:
      SIGNING_SECRET:
        required: true
  workflow_dispatch:
    inputs:
      handwritten:
        description: 'Small changelog about changes in this build:'
      target:
        description: 'Release Branch (e.g., testing). Defaults to branch name.'
permissions: {}

name: Generate Release
jobs:
  generate-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout last 500 commits (for <commits> to work)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 500

      - name: Get target
        id: get-target
        run: |
          TARGET="${{ github.event.inputs.target || github.ref }}"
          TARGET="${TARGET##*/}"
          if [ "$TARGET" = "main" ]; then
            TARGET="stable"
          fi
          echo "target=$TARGET" >> $GITHUB_OUTPUT

      - name: Install ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Download package versions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: packages-in

      - name: Generate Release Text
        id: generate-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ./.github/workflows/changelog.py \
            "${{ steps.get-target.outputs.target }}" \
            ./output.env ./changelog.md --workdir . --handwritten "${{ github.event.inputs.handwritten }}" \
            --packages-dir packages-in --packages-out packages.json \
            --registry "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          source ./output.env
          echo "title=${TITLE}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Setup Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.5'

      - name: Sign and verify release manifest
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          cosign sign-blob -y --key env://SIGNING_KEY packages.json \
            --output-signature packages.json.sig \
            --new-bundle-format --bundle packages.json.sigstore.json
          cosign verify-blob --key cosign.pub --new-bundle-format \
            --bundle packages.json.sigstore.json packages.json

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          name: ${{ steps.generate-release.outputs.title }}
          tag_name: ${{ steps.generate-release.outputs.tag }}
          body_path: ./changelog.md
          files: |
            packages.json
            packages.json.sig
            packages.json.sigstore.json
          fail_on_unmatched_files: true
          make_latest: ${{ steps.get-target.outputs.target == 'stable' }}
          prerelease: ${{ steps.get-target.outputs.target != 'stable' }}
