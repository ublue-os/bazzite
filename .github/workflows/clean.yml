name: Cleanup Old Images
on:
  schedule:
    - cron: "15 0 * * 0" # 0015 UTC on Sundays
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}

jobs:
  delete-older-than-90:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The package list used to be a hardcoded, stale copy (still listing
      # retired budgie/asus/surface variants). It now comes straight from
      # build.py's IMAGES table -- the same source used by build.yml,
      # build_iso.yml, and changelog.py.
      - name: Compute image list
        id: images
        run: echo "packages=$(./build.py images | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"

      - name: Delete Images Older Than 90 Days
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: ${{ steps.images.outputs.packages }}
          older-than: 90 days
          delete-orphaned-images: true
          keep-n-tagged: 7
          keep-n-untagged: 7
