name: Build Bazzite
on:
  schedule:
    - cron: "40 4 * * 1" # 4:40 utc monday
  pull_request:
    branches:
      - testing
      - unstable
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "installer/**"
      - "repo_content/**"
      - "spec_files/**"
      - "post_install_files/**"
      - "press_kit/**"
      - "docs/**"
      - ".github/workflows/build_iso*.yml"
  push:
    branches:
      - testing
      - unstable
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "repo_content/**"
      - "spec_files/**"
      - "post_install_files/**"
      - "press_kit/**"
      - ".github/workflows/build_iso*.yml"
  merge_group:
  workflow_dispatch:
    inputs:
      handwritten:
        description: "Small changelog:"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  REPO_OWNER: ${{ github.repository_owner }}

jobs:
  # Matrix has to be known before push-ghcr's jobs are scheduled, so this
  # computes it in a separate job and feeds it in via fromJson. The matrix
  # itself now lives in build.py's IMAGES table (the single source of truth
  # also used by build_iso.yml, clean.yml, and changelog.py) instead of
  # being hardcoded here.
  compute-matrix:
    name: Compute build matrix
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compute matrix
        id: matrix
        run: echo "matrix=$(./build.py matrix)" >> "$GITHUB_OUTPUT"

  push-ghcr:
    name: Make
    needs: compute-matrix
    runs-on: ubuntu-26.04
    continue-on-error: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.compute-matrix.outputs.matrix) }}
    steps:
      - name: Show disk space
        run: sudo df -h

      - name: Check if /mnt is there
        id: check_mnt
        run: |
          if sudo mountpoint /mnt; then
            echo "mnt_is_there=1" >>$GITHUB_OUTPUT
          else
            echo "mnt_is_there=0" >>$GITHUB_OUTPUT
          fi

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1

      # Moved up from its old spot (after "Define base variables") --
      # build.py has to exist on disk before the next step can call it.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      # The image registry name must be lower-case, but GitHub usernames can be capitalized.
      - name: Get lower-case equivalent of the repository owner's username
        id: repo_owner_case
        run: echo "lowercase=${REPO_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Replaces the old "Define base variables" / "Pull Images and find
      # versions" / "Prepare build args file" steps. build.py's IMAGES table
      # and resolve() are the single source of truth for the per-image
      # target/nvidia_base/nvidia_flavor derivation (see build.py's IMAGES
      # comment for why that used to be substring-matched bash), and for the
      # version/tag/label logic covered by build.py's golden tests. This
      # also fixes SHA_HEAD_SHORT always being empty in the old build args
      # file -- that field genuinely comes from github.sha now.
      #
      # Point-release dedup (the .1/.2 suffix) happens here too, against the
      # registry's current tag list -- same as before, just earlier in the
      # job. It only reads registry metadata, not the built image, so the
      # timing shift doesn't change the result.
      - name: Resolve build config
        id: resolve
        run: |
          ./build.py -v resolve \
            --image "${{ matrix.image }}" \
            --ref-name "${{ github.ref_name }}" \
            --sha "${{ github.sha }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --push-registry "ghcr.io/${{ steps.repo_owner_case.outputs.lowercase }}" \
            > resolved.json
          jq . resolved.json

          {
            echo "output_image=$(jq -r .output_image resolved.json)"
            echo "container_target=$(jq -r .container_target resolved.json)"
            echo "nvidia_base=$(jq -r .nvidia_base resolved.json)"
            echo "nvidia_flavor=$(jq -r .nvidia_flavor resolved.json)"
            echo "install_nvidia=$(jq -r .install_nvidia resolved.json)"
            echo "akmods_tag=$(jq -r .akmods_tag resolved.json)"
            echo "akmods_nvidia_tag=$(jq -r '.akmods_nvidia_tag // empty' resolved.json)"
            echo "version=$(jq -r .version resolved.json)"
            echo "source_version_tag=$(jq -r .build_args.VERSION_TAG resolved.json)"
            echo "alias_tags=$(jq -r '.alias_tags | join(" ")' resolved.json)"
          } >> "$GITHUB_OUTPUT"

      # Prepare offline documentation
      - name: Download offline docs
        id: download_offline_docs
        continue-on-error: true
        env:
          docs_repo: ublue-os/docs.bazzite.gg
          GH_TOKEN: ${{ github.token }}
        run: |
          DOCS_DIR="${{ github.workspace }}/system_files/desktop/shared/usr/share/ublue-os/docs/html"
          mkdir -p $DOCS_DIR
          cd $(mktemp -d)
          gh run download --repo=$docs_repo -n github-pages
          tar -xC "$DOCS_DIR" -f artifact.tar

      - name: Check just syntax
        uses: ublue-os/just-action@v3

      # Fail fast with a clear error and warm the local pull cache before
      # DNF Package Cache Prep / Build Image, same as the old "Pull Images
      # and find versions" step's podman pull calls. skopeo inspect (inside
      # build.py resolve) doesn't require a local pull, so this is the only
      # remaining reason to do it explicitly -- buildah build would pull
      # these on demand anyway.
      - name: Prefetch images
        run: |
          set -eo pipefail
          podman pull "$(jq -r .base_image resolved.json)"
          podman pull "ghcr.io/ublue-os/akmods:${{ steps.resolve.outputs.akmods_tag }}"
          if [ "${{ steps.resolve.outputs.install_nvidia }}" == "true" ]; then
            podman pull "ghcr.io/ublue-os/akmods-${{ steps.resolve.outputs.nvidia_flavor }}:${{ steps.resolve.outputs.akmods_tag }}"
          fi

      - name: DNF Package Cache Prep
        id: cache-prep
        env:
          IMAGE: ${{ matrix.image }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          FEDORA_VERSION: ${{ matrix.fedora_version }}
        run: |
          set -eoux pipefail

          # Rootless buildah caches to /var/tmp/buildah-cache-$UID rather than
          # -0, so the old rootful caches are dead weight. Bump to invalidate.
          CACHE_NAME="bazzite-${FEDORA_VERSION}-rootless"

          ALLOW_CACHE_WRITE="false"

          # TODO: If we ever integrate dx images here then this may need to be adjusted
          # TODO: remove testing here when we have cache on main branch
          # PR caches are useless and may wipe cache on main
          if [[ "${IMAGE}" =~ "-deck" ]] && \
             [[ ! "${IMAGE}" =~ "gnome" ]] && \
             [[ "${EVENT_NAME}" != "pull_request" ]] && \
             [[ "${REF_NAME}" == "main" || "${REF_NAME}" == "testing" ]]; then
            ALLOW_CACHE_WRITE="true"
          fi

          echo "cache_name=${CACHE_NAME}" >> "$GITHUB_OUTPUT"
          echo "allow_cache_write=${ALLOW_CACHE_WRITE}" >> "$GITHUB_OUTPUT"

      - name: Restore DNF package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          CACHE_NAME: ${{ steps.cache-prep.outputs.cache_name }}
          ALLOW_CACHE_WRITE: ${{ steps.cache-prep.outputs.allow_cache_write }}
        with:
          path: /var/tmp/buildah-cache-*
          key: ${{ runner.os }}-${{ runner.arch }}-buildah-${{ env.CACHE_NAME }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-buildah-${{ env.CACHE_NAME }}-
            ${{ runner.os }}-${{ runner.arch }}-buildah-${{ env.CACHE_NAME }}

      # Build image using buildah and save it to raw-img
      - name: Build Image
        id: build_image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./build.py build \
            --image "${{ matrix.image }}" \
            --container-mgr buildah \
            --resolved-json resolved.json \
            --secret "id=GITHUB_TOKEN,env=GITHUB_TOKEN" \
            --tag raw-img

      - name: Save DNF package cache
        if: steps.cache-prep.outputs.allow_cache_write == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          CACHE_NAME: ${{ steps.cache-prep.outputs.cache_name }}
          ALLOW_CACHE_WRITE: ${{ steps.cache-prep.outputs.allow_cache_write }}
        with:
          path: /var/tmp/buildah-cache-*
          key: ${{ runner.os }}-${{ runner.arch }}-buildah-${{ env.CACHE_NAME }}

      # The final image label set. Everything except ostree.linux is already
      # known (build.py resolve computed the deduped version + static OCI
      # fields before the build even started); ostree.linux has to come from
      # the actual built image, since the installed kernel-core NEVRA isn't
      # guaranteed to match the KERNEL_VERSION build-arg's formatting.
      - name: Apply Labels
        run: |
          kver=$(podman run --rm raw-img rpm -q --qf "%{VERSION}-%{RELEASE}.%{ARCH}\n" kernel-core)
          jq --arg kver "$kver" '.labels["ostree.linux"] = $kver' resolved.json > resolved.json.tmp
          mv resolved.json.tmp resolved.json

          jq -r '.labels | to_entries[] | "\(.key)=\(.value)"' resolved.json > "${RUNNER_TEMP}/labels.txt"

          echo "Labels for the final image:"
          cat "${RUNNER_TEMP}/labels.txt"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      # Reprocess raw-img with chunkah
      - name: Run Chunkah
        id: rechunk
        run: |
          ./build.py rechunk \
            --raw-image raw-img \
            --chunked-image localhost/chunked-img \
            --labels-file "${RUNNER_TEMP}/labels.txt" \
            > rechunk.json
          echo "ref=$(jq -r .ref rechunk.json)" >> "$GITHUB_OUTPUT"

      - name: Setup Syft
        id: setup-syft
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          # FIXME: a renovate rule for this would be nice
          syft-version: v1.44.0

      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        id: generate-sbom
        env:
          IMAGE: ${{ matrix.image }}
          VERSION_TAG: ${{ steps.resolve.outputs.source_version_tag }}
          SYFT_CMD: ${{ steps.setup-syft.outputs.cmd }}
        run: |
          ./build.py sbom \
            --image "${IMAGE}" \
            --chunked-image localhost/chunked-img \
            --version-tag "${VERSION_TAG}" \
            --container-mgr podman \
            --syft-cmd "${SYFT_CMD}" \
            > sbom.json
          du -sh "$(jq -r .sbom sbom.json)"
          echo "SBOM=$(jq -r .sbom sbom.json)" >> $GITHUB_OUTPUT

      - name: Install dgoss
        run: |
          set -euo pipefail
          GOSS_VERSION=v0.4.10
          # goss release tarballs use linux_x86_64 naming for amd64 systems.
          curl -fL \
            "https://github.com/goss-org/goss/releases/download/${GOSS_VERSION}/goss_${GOSS_VERSION#v}_linux_x86_64.tar.gz" \
            -o /tmp/goss.tar.gz
          tar -xzf /tmp/goss.tar.gz -C /usr/local/bin goss
          test -f /usr/local/bin/goss || { echo "Error: /usr/local/bin/goss binary not found after extraction"; exit 1; }
          chmod +rx /usr/local/bin/goss
          /usr/local/bin/goss --version >/dev/null
          rm -f /tmp/goss.tar.gz
          curl -fL \
            "https://github.com/goss-org/goss/releases/download/${GOSS_VERSION}/dgoss" \
            -o /usr/local/bin/dgoss
          chmod +rx /usr/local/bin/dgoss

      - name: Run goss tests
        run: ./build.py test --ref "${{ steps.rechunk.outputs.ref }}"

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Push the image to GHCR (Image Registry)
      - name: Push to GHCR
        id: push
        if: github.event_name != 'pull_request'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 10
          command: |
            ./build.py push \
              --output-image "${{ steps.resolve.outputs.output_image }}" \
              --version "${{ steps.resolve.outputs.version }}" \
              --alias-tags "${{ steps.resolve.outputs.alias_tags }}" \
              --rechunk-ref "${{ steps.rechunk.outputs.ref }}" \
              > push.json
            echo "digest=$(jq -r .digest push.json)" >> "$GITHUB_OUTPUT"

      - name: Sign container image
        if: github.event_name != 'pull_request'
        run: ./build.py sign --ref "${{ steps.resolve.outputs.output_image }}@${{ steps.push.outputs.digest }}"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

      - name: Install ORAS
        if: github.event_name != 'pull_request'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Login to GitHub Container Registry with ORAS
        if: github.event_name != 'pull_request'
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Upload SBOM
        if: github.event_name != 'pull_request'
        id: upload-sbom
        run: |
          ./build.py sbom-attach \
            --image "${{ steps.resolve.outputs.output_image }}" \
            --digest "${{ steps.push.outputs.digest }}" \
            --sbom "${{ steps.generate-sbom.outputs.SBOM }}" \
            > sbom-attach.json
          echo "sbom_digest=$(jq -r .sbom_digest sbom-attach.json)" >> $GITHUB_OUTPUT

      - name: Sign SBOM OCI Artifact
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: ./build.py sign --ref "${{ steps.resolve.outputs.output_image }}@${{ steps.upload-sbom.outputs.sbom_digest }}"

      - name: Attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.resolve.outputs.output_image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  generate_release:
    name: Generate Release
    needs: [push-ghcr]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/generate_release.yml

  kickoff_gamemode_news:
    name: Build Game Mode Announcements
    runs-on: ubuntu-24.04
    needs: [generate_release]
    if: github.repository == 'ublue-os/bazzite' && github.event_name != 'pull_request'
    steps:
      - name: Get target branch
        id: get-target
        run: |
          TARGET="${{ github.ref }}"
          TARGET="${TARGET##*/}"
          if [ "$TARGET" = "main" ]; then
            TARGET="stable"
          fi
          echo "target=$TARGET" >> $GITHUB_OUTPUT

      - name: Kickoff Game Mode Announcements
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        continue-on-error: true
        with:
          token: ${{ secrets.PAT }}
          repository: ublue-os/bazzite-gamemode-news
          event-type: build-announcements
          client-payload: '{"branch": "${{ steps.get-target.outputs.target }}"}'

  kickoff_bazzite_dx:
    runs-on: ubuntu-24.04
    needs: [generate_release]
    if: github.repository == 'ublue-os/bazzite' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - name: Kickoff Bazzite-DX
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        continue-on-error: true
        with:
          token: ${{ secrets.PAT }}
          repository: ublue-os/bazzite-dx
          event-type: build
