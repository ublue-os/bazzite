# Category fragment appended to tools.yml only for HTPC and handheld image builds.
  - title: "HTPC & Handheld"
    description: "Settings specific to HTPC and handheld images."
    actions:
      - id: "default-deck-session"
        title: "Set Default Deck Login Mode"
        description: "Change whether your Deck/HTPC logs start in Game Mode or Desktop"
        status_script: "steamosctl get-default-login-mode"
        options:
          - id: "set-to-game-mode"
            label: "Set to Game Mode"
            script: "ujust set-default-game-mode"
          - id: "set-default-desktop"
            label: "Set to Desktop Mode"
            script: "ujust set-default-desktop"
      - id: "configure-opengamepadui"
        title: "Toggle OpenGamepadUI overlay"
        description: "Enable or disable the OpenGamepadUI overlay in Game Mode."
        default: false
        status_script: "ujust configure-opengamepadui status"
        options:
          - id: "enable"
            label: "Enable OpenGamepadUI Overlay"
            script: "ujust configure-opengamepadui enable"
          - id: "disable"
            label: "Disable OpenGamepadUI Overlay"
            script: "ujust configure-opengamepadui disable"
      - id: "inputplumber"
        title: "Toggle InputPlumber"
        description: "Useful for duplicate controller input on desktop/HTPC systems."
        default: false
        status_script: 'bash -lc ''systemctl is-enabled --quiet inputplumber.service && echo enable || echo disable'''
        options:
          - id: "enable"
            label: "Enable InputPlumber"
            script: "sudo systemctl enable --now inputplumber.service"
          - id: "disable"
            label: "Disable InputPlumber"
            script: "sudo systemctl disable --now inputplumber.service"
      - id: "steamos-automount"
        title: "Toggle SteamOS disk automounting"
        description: "Manage mounting rules sourced from SteamOS — useful for stopping NTFS partitions from getting mounted automatically."
        default: false
        status_script: "ujust steamos-automount status"
        options:
          - id: "enable"
            label: "Enable SteamOS Automounting"
            script: "ujust steamos-automount enable"
          - id: "disable"
            label: "Disable SteamOS Automounting"
            script: "ujust steamos-automount disable"
