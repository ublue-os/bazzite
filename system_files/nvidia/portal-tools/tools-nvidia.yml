# Category fragment appended to tools.yml only for NVIDIA image builds.
  - title: "NVIDIA"
    description: "Settings specific to NVIDIA images."
    actions:
      - id: "update-nvidia-runtime"
        title: "Update Flatpak libraries for NVIDIA"
        description: "Manually match the Flatpak runtime with the driver version in your system image. This is usually handled automatically in background updates."
        default: false
        status_script: "ujust update-nvidia-runtime status"
        script: "ujust update-nvidia-runtime upgrade"
      - id: "global-dlss"
        title: "Enable globally upgrading DLSS"
        description: "Toggle automated version upgrades for upscaling. Requires a custom edition of Proton with this feature (e.g. Proton-GE, Proton-EM)."
        default: false
        options:
          - id: "enable"
            label: "Enable Autoupgrading DLSS"
            script: "ujust global-dlss enable"
          - id: "disable"
            label: "Disable Autoupgrading DLSS"
            script: "ujust global-dlss disable"
