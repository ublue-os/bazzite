# Fonts
font_family      SauceCodePro Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        17.0
modify_font cell_height 110%
modify_font cell_width  102%
text_composition_strategy 1.0 30
disable_ligatures never

# Performance
repaint_delay   8
input_delay     1
sync_to_monitor yes

# Window
background_opacity      1.0
window_padding_width    4
hide_window_decorations no
confirm_os_window_close 0
enable_audio_bell       no
scrollback_lines        10000
enabled_layouts         splits,stack

# Tab bar
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   angled
tab_bar_min_tabs      1
tab_title_template    "{index}: {title}"
active_tab_font_style bold

# Keybindings
map alt+enter        launch --location=hsplit --cwd=current
map alt+w            close_window_with_confirmation ignore-shell
map alt+t            new_tab
map alt+left         previous_tab
map alt+right        next_tab
map alt+c            copy_to_clipboard
map alt+v            paste_from_clipboard
map alt+equal        change_font_size all +1.0
map alt+minus        change_font_size all -1.0
map alt+0            change_font_size all 0

map alt+shift+enter  launch --location=vsplit --cwd=current
map alt+shift+left   neighboring_window left
map alt+shift+right  neighboring_window right
map alt+shift+z      toggle_layout stack
map alt+shift+equal  swap_with_window

map alt+up           neighboring_window up
map alt+down         neighboring_window down

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8

map ctrl+shift+alt+left  move_tab_backward
map ctrl+shift+alt+right move_tab_forward

# Mouse
mouse_map right press ungrabbed copy_to_clipboard
mouse_map middle press ungrabbed launch --location=hsplit --cwd=current
mouse_map shift+middle press ungrabbed close_window

# Colors — written by the wallpaper picker (scripts/wallpaper-theme).
# Palette + tab colors both live in current-theme.conf.
# BEGIN_KITTY_THEME
# GitHub Dark
include current-theme.conf
# END_KITTY_THEME
