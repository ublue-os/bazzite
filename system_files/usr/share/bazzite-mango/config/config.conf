# ~/.config/mango/config.conf — Super as the mod key.
# Reload live with Super+Shift+r. Full option list: /etc/mango/config.conf
# Everything this file runs lives under ~/.config/mango (scripts/, rofi/,
# dunst/, quickshell/, wallpaper/) so the setup is self-contained.

# --- look ---
# borderpx and unfocused_opacity (1.0 = no dimming) have sliders in the
# bar's layout picker (persisted to mango-effects along with the toggles).
borderpx=2
border_radius=8
# inner gaps come from the bar's "window gap" slider (mango-gaps file);
# outer gaps match the bar's edge inset so windows float like the bar does.
# 8 is the 1080p value — the bar re-applies it scaled to the screen on start.
gappih=5
gappiv=5
gappoh=8
gappov=8
focuscolor=0x80a0ffff
bordercolor=0x080808ff
urgentcolor=0xef9f76ff
# wallpaper-theme writes border colours to theme.conf on every wallpaper
# pick. Sourced after the defaults above so the picked colours win.
source-optional=~/.config/mango/theme.conf
# --- effects: the part dwm never had ---
# Shadows under floating windows and the bar's popups; blur (off by
# default, it costs GPU) frosts what's behind the bar's popups when on.
# Tiled windows stay flat and opaque so the desktop stays quick. The
# layout picker's Effects toggles flip these live (persisted to
# mango-effects, the way the gap slider is).
shadows=1
shadow_only_floating=1
layer_shadows=1
shadows_size=12
shadows_blur=18
shadowscolor=0x00000099
blur=0
blur_layer=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2
# windows slide in and fade out; popups and rofi animate too
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
animation_duration_open=300
animation_duration_close=250
animation_duration_tag=250
animation_duration_move=250
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1

# --- outputs ---
# Defaults pick every monitor's preferred mode (normally its highest
# refresh rate) at scale 1, so most setups need nothing here. One
# monitorrule per output overrides that: name is a regex, `wlr-randr`
# lists names and modes, scale can be fractional (1.25, 1.5), vrr:1 turns
# on adaptive sync. Two templates:
#monitorrule=name:^DP-1$,width:3440,height:1440,refresh:180,x:0,y:0,scale:1,vrr:1
#monitorrule=name:^eDP-1$,scale:1.5
# tearing only for fullscreen clients that ask for it (games)
allow_tearing=2

# --- input ---
numlockon=1
repeat_rate=50
repeat_delay=300
tap_to_click=1
trackpad_natural_scrolling=1
disable_while_typing=1
sloppyfocus=1
# floating windows snap to the edges and each other while dragged
enable_floating_snap=1
snap_distance=30
# hot corner: push the cursor into the corner for the overview
enable_hotarea=1
hotarea_size=10

# --- layout: master/stack on every tag ---
new_is_master=1
default_mfact=0.55
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile
tagrule=id:10,layout_name:tile
tagrule=id:11,layout_name:tile
tagrule=id:12,layout_name:tile

# --- autostart ---
# Push the session environment to systemd/D-Bus-activated services, then
# restart the portals (screen sharing, file dialogs) in that order — one
# line, because mango forks every exec-once at once. A portal left over from
# an earlier login in this same user session (an X11 WM, or a previous mango
# with a stale WAYLAND_DISPLAY) would otherwise serve the wrong desktop and
# offer no ScreenCast. (KITTY_CONFIG_DIRECTORY is deliberately not pushed:
# the user manager outlives a logout, so it would leak into the next X11
# session's D-Bus-launched terminals. Like the other setups, it stays a
# plain export — ~/.config/mango/env via mango-session — so each session's
# kitty reads only its own folder.)
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP MANGO_INSTANCE_SIGNATURE && systemctl --user restart xdg-desktop-portal-wlr xdg-desktop-portal-gtk xdg-desktop-portal
exec-once=awww-daemon
exec-once=awww img $HOME/.config/mango/omarchy-themes/osaka-jade/backgrounds/2-shaded-entrance.webp --resize crop
exec-once=dunst -config ~/.config/mango/dunst/dunstrc
exec-once=lxpolkit
# automount removable drives (notifications through dunst)
exec-once=udiskie
exec-once=wl-paste --watch cliphist store
# lock after 5 min idle, monitor off after 15, lock before suspend
exec-once=swayidle -w timeout 300 'swaylock -f -c 1e1e2e' timeout 900 'wlopm --off \*' resume 'wlopm --on \*' before-sleep 'swaylock -f -c 1e1e2e'
# quickshell bar (-n: exit if already running, so a config reload is safe)
exec-once=qs -p ~/.config/mango/quickshell -d -n

# --- apps ---
# Terminal
bind=SUPER,Return,spawn,kitty
# Drop-down terminal (launches the first time, then toggles)
bind=SUPER,grave,toggle_named_scratchpad,kitty-scratch,none,kitty --class kitty-scratch
# App launcher
bind=SUPER,space,spawn,rofi -show drun -show-icons -theme ~/.config/mango/rofi/config.rasi
# Browser (Firefox)
bind=SUPER,b,spawn,flatpak run org.mozilla.firefox
# Browser (Firefox, private)
bind=SUPER+SHIFT,b,spawn,flatpak run org.mozilla.firefox --private-window
# Helium browser
bind=SUPER,c,spawn,helium
# File manager (Nautilus)
bind=SUPER,f,spawn,nautilus --new-window
# Editor
bind=SUPER,e,spawn,geany
# Discord (opens on tag 8)
bind=SUPER,d,spawn,flatpak run com.discordapp.Discord
# GIMP (opens on tag 9)
bind=SUPER,g,spawn,flatpak run org.gimp.GIMP
# OBS (opens on tag 10)
bind=SUPER,o,spawn,flatpak run com.obsproject.Studio
# Power menu
bind=SUPER,x,spawn,~/.config/mango/scripts/power
# Keybinding help
bind=SUPER,slash,spawn,~/.config/mango/scripts/help
# Lock screen
bind=SUPER,Escape,spawn,swaylock -f -c 1e1e2e

# --- bar popups (quickshell IPC) ---
# Wallpaper picker (re-themes the desktop from the image)
bind=SUPER+SHIFT,p,spawn,qs -p ~/.config/mango/quickshell ipc call wallpapers toggle
# Command menu
bind=SUPER+SHIFT,m,spawn,qs -p ~/.config/mango/quickshell ipc call commands toggle
# Network app
bind=SUPER+SHIFT,n,spawn,~/.config/mango/scripts/network
# Layout / tweaks picker
bind=SUPER+SHIFT,t,spawn,qs -p ~/.config/mango/quickshell ipc call layouts toggle
# Omarchy-style system menu (same as clicking the Debian logo)
bind=SUPER+ALT,space,spawn,~/.config/mango/scripts/menu
# Theme picker (Omarchy themes)
bind=SUPER+CTRL+SHIFT,space,spawn,~/.config/mango/scripts/theme-menu theme
# Background picker (current theme)
bind=SUPER+CTRL,space,spawn,~/.config/mango/scripts/theme-menu bg
# Next background (current theme)
bind=SUPER+CTRL+ALT,space,spawn,~/.config/mango/scripts/theme-menu next
# Audio panel
bind=SUPER+CTRL,a,spawn,qs -p ~/.config/mango/quickshell ipc call volume toggle
# Network panel (Wi-Fi, DNS)
bind=SUPER+CTRL,w,spawn,qs -p ~/.config/mango/quickshell ipc call network toggle
# Bluetooth manager
bind=SUPER+CTRL,b,spawn,blueman-manager
# Display panel
bind=SUPER+CTRL,d,spawn,qs -p ~/.config/mango/quickshell ipc call display toggle
# Power panel
bind=SUPER+CTRL,p,spawn,qs -p ~/.config/mango/quickshell ipc call power toggle

# --- windows ---
# Close window
bind=SUPER,q,killclient,
# Quit mango
bind=SUPER+SHIFT,q,quit
# Reload config (scripts/mango-reload: reload_config, then the bar
# re-applies the gaps the reload just reset to config.conf's values)
bind=SUPER+SHIFT,r,spawn,~/.config/mango/scripts/mango-reload
# Toggle floating
bind=SUPER+SHIFT,space,togglefloating,
# Fullscreen
bind=SUPER+SHIFT,f,togglefullscreen,
# Cycle layouts
bind=SUPER,t,switch_layout
# Monocle layout
bind=SUPER,w,setlayout,monocle
# Overview of all windows
bind=SUPER,Tab,toggleoverview,
# Next / previous window
bind=ALT,Tab,focusstack,next
bind=ALT+SHIFT,Tab,focusstack,prev

# focus / move (arrows and hjkl)
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

# monitors (comma / period, like dwm)
# Focus previous / next monitor
bind=SUPER,comma,focusmon,left
bind=SUPER,period,focusmon,right
# Send window to previous / next monitor
bind=SUPER+SHIFT,comma,tagmon,left
bind=SUPER+SHIFT,period,tagmon,right

# resize master area / master count
bind=SUPER+CTRL,Left,setmfact,-0.02
bind=SUPER+CTRL,Right,setmfact,+0.02
bind=SUPER+CTRL,Up,incnmaster,+1
bind=SUPER+CTRL,Down,incnmaster,-1

# --- tags (workspaces): 12, like the other setups. 10-12 need the
# butterrepo mangowc build (patches/12-tags.patch); stock mango has 9. ---
# Tags 1-5 live on the laptop panel, 6-10 on the external monitor;
# viewcrossmon focuses that monitor (or stays put when it isn't plugged in).
# Sending goes through scripts/ws-send for the same laptop-only fallback.

# View tag 1 (laptop)
bind=SUPER,1,viewcrossmon,1,^eDP
# View tag 2 (laptop)
bind=SUPER,2,viewcrossmon,2,^eDP
# View tag 3 (laptop)
bind=SUPER,3,viewcrossmon,3,^eDP
# View tag 4 (laptop)
bind=SUPER,4,viewcrossmon,4,^eDP
# View tag 5 (laptop)
bind=SUPER,5,viewcrossmon,5,^eDP
# View tag 6 (external monitor)
bind=SUPER,6,viewcrossmon,6,^(HDMI|DP)
# View tag 7 (external monitor)
bind=SUPER,7,viewcrossmon,7,^(HDMI|DP)
# View tag 8 (external monitor)
bind=SUPER,8,viewcrossmon,8,^(HDMI|DP)
# View tag 9 (external monitor)
bind=SUPER,9,viewcrossmon,9,^(HDMI|DP)
# View tag 10 (external monitor)
bind=SUPER,0,viewcrossmon,10,^(HDMI|DP)
bind=SUPER,minus,view,11
bind=SUPER,equal,view,12
# Send window to tag 1
bind=SUPER+SHIFT,1,spawn,~/.config/mango/scripts/ws-send 1
# Send window to tag 2
bind=SUPER+SHIFT,2,spawn,~/.config/mango/scripts/ws-send 2
# Send window to tag 3
bind=SUPER+SHIFT,3,spawn,~/.config/mango/scripts/ws-send 3
# Send window to tag 4
bind=SUPER+SHIFT,4,spawn,~/.config/mango/scripts/ws-send 4
# Send window to tag 5
bind=SUPER+SHIFT,5,spawn,~/.config/mango/scripts/ws-send 5
# Send window to tag 6
bind=SUPER+SHIFT,6,spawn,~/.config/mango/scripts/ws-send 6
# Send window to tag 7
bind=SUPER+SHIFT,7,spawn,~/.config/mango/scripts/ws-send 7
# Send window to tag 8
bind=SUPER+SHIFT,8,spawn,~/.config/mango/scripts/ws-send 8
# Send window to tag 9
bind=SUPER+SHIFT,9,spawn,~/.config/mango/scripts/ws-send 9
# Send window to tag 10
bind=SUPER+SHIFT,0,spawn,~/.config/mango/scripts/ws-send 10
bind=SUPER+SHIFT,minus,tag,11
bind=SUPER+SHIFT,equal,tag,12

# --- media / screenshots ---
bind=NONE,XF86AudioRaiseVolume,spawn,~/.config/mango/scripts/changevolume up
bind=NONE,XF86AudioLowerVolume,spawn,~/.config/mango/scripts/changevolume down
bind=NONE,XF86AudioMute,spawn,~/.config/mango/scripts/changevolume mute
# Volume up / down / mute (same keys as the other setups)
bind=SUPER,F12,spawn,~/.config/mango/scripts/changevolume up
bind=SUPER,F11,spawn,~/.config/mango/scripts/changevolume down
bind=SUPER,F10,spawn,~/.config/mango/scripts/changevolume mute
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
# Screenshot (full screen)
bind=SUPER,s,spawn,~/.config/mango/scripts/screenshot full
# Screenshot (select region)
bind=SUPER+SHIFT,s,spawn,~/.config/mango/scripts/screenshot region

# --- mouse ---
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
# Super + scroll wheel walks the tags
axisbind=SUPER,UP,viewtoleft
axisbind=SUPER,DOWN,viewtoright

# --- touchpad gestures ---
# three fingers: swipe through the tags, up or down for the overview
gesturebind=none,left,3,viewtoright
gesturebind=none,right,3,viewtoleft
gesturebind=none,up,3,toggleoverview
gesturebind=none,down,3,toggleoverview
# four fingers: swipe through the tags carrying the focused window
gesturebind=none,left,4,viewtoright_have_client
gesturebind=none,right,4,viewtoleft_have_client

# --- layer rules ---
# rofi zooms in and out instead of sliding
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

# --- tag rules: apps with a home tag (same homes as the other setups).
# mango switches to the tag when the window opens. App ids are regexes;
# the alternatives cover the Wayland and Xwayland ids these apps report. ---
windowrule=tags:8,monitor:^(HDMI|DP),appid:^(discord|Discord)$
windowrule=tags:9,monitor:^(HDMI|DP),appid:^(gimp|Gimp|org\.gimp\.GIMP)$
windowrule=tags:10,monitor:^(HDMI|DP),appid:^(com\.obsproject\.Studio|obs)$
# Firefox always opens on tag 6 (the external monitor when one is attached)
windowrule=tags:6,monitor:^(HDMI|DP),appid:^(firefox|firefox-esr)$

# --- floating rules ---
# the drop-down terminal (Super+grave): centred, 60% of the screen
windowrule=isnamedscratchpad:1,width:0.6,height:0.6,appid:kitty-scratch
# quickshell's network app (its own qs instance) — a small tool window
windowrule=isfloating:1,width:0.35,height:0.6,appid:org.quickshell
# ExpressVPN's GUI (Xwayland, class expressvpn-client)
windowrule=isfloating:1,width:0.3,height:0.65,appid:^expressvpn
windowrule=isfloating:1,appid:mpv
windowrule=isfloating:1,appid:eog
windowrule=isfloating:1,appid:galculator
windowrule=isfloating:1,appid:transmission-gtk
windowrule=isfloating:1,appid:nwg-look
windowrule=isfloating:1,appid:pavucontrol
windowrule=isfloating:1,appid:blueman-manager
