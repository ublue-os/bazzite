# A tmpfiles config to enable btrfs reclaims to prevent ENOSPC from occuring even when space is available on drive.
# FIXME: Remove this once upstream enables some sort of reclaim, or handles BTRFS space allocation gracefully by default.

w /sys/fs/btrfs/*/allocation/data/dynamic_reclaim - - - - 1
w /sys/fs/btrfs/*/allocation/metadata/dynamic_reclaim - - - - 1
w /sys/fs/btrfs/*/allocation/data/periodic_reclaim - - - - 1
w /sys/fs/btrfs/*/allocation/metadata/periodic_reclaim - - - - 1
